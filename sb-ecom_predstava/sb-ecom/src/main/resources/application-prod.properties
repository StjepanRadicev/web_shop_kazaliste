# PostgreSQL - Cloud
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Logging
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.ecommerce.project=INFO


# JWT konfiguracija
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
spring.app.jwtSecret=${JWT_SECRET}
spring.ecom.app.jwtCookieName=${JWT_COOKIE_NAME}


# JWT Cookie - Production
app.cookie.secure=true
app.cookie.same-site=None

# React frontend
frontend.url=${FRONTEND_URL}

# Images
project.image=${PROJECT_IMAGE_PATH:images/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}